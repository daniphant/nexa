[workspace]
members = [
    "apps/cli",
    "apps/server",
    "crates/harness",
    "crates/protocol",
    "crates/runtime",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
version = "0.1.0"

[workspace.dependencies]
axum = { version = "=0.8.9", features = ["json"] }
dirs = "=6.0.0"
futures-util = "=0.3.34"
nexa-harness = { path = "crates/harness" }
nexa-protocol = { path = "crates/protocol" }
nexa-runtime = { path = "crates/runtime" }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rpassword = "=7.5.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync"] }
tokio-stream = "=0.1.19"
toml = "=1.1.4"

[workspace.lints.rust]
unsafe_code = "forbid"
