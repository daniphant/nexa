[workspace]
members = [
    "apps/cli",
    "apps/desktop",
    "apps/server",
    "crates/client",
    "crates/harness",
    "crates/protocol",
    "crates/runtime",
    "crates/tui",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
version = "0.1.0"

[workspace.dependencies]
axum = { version = "=0.8.9", features = ["json"] }
crossterm = { version = "=0.29.0", features = ["event-stream"] }
dirs = "=6.0.0"
eframe = "=0.36.1"
egui = "=0.36.1"
epaint_default_fonts = "=0.36.1"
futures-util = "=0.3.34"
getrandom = "=0.4.3"
nexa-client = { path = "crates/client" }
nexa-harness = { path = "crates/harness" }
nexa-protocol = { path = "crates/protocol" }
nexa-runtime = { path = "crates/runtime" }
nexa-tui = { path = "crates/tui" }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rfd = "=0.17.2"
rpassword = "=7.5.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = "=0.1.19"
toml = "=1.1.4"

[workspace.lints.rust]
unsafe_code = "forbid"
